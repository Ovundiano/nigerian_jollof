{% extends 'recipes/base.html' %}

{% block title %}Edit Comment{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>Edit Comment</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            {{ form.content }}
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Update Comment</button>
                            <a href="{% url 'recipes:recipe_detail' pk=comment.recipe.pk %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
