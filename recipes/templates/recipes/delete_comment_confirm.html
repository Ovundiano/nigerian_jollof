{% extends 'recipes/base.html' %}

{% block title %}Delete Comment{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>Delete Comment</h4>
                </div>
                <div class="card-body">
                    <p>Are you sure you want to delete this comment?</p>
                    <blockquote class="blockquote">
                        <p class="mb-0">{{ comment.content }}</p>
                        <footer class="blockquote-footer">Comment on <cite>{{ comment.recipe.title }}</cite></footer>
                    </blockquote>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Delete Comment</button>
                        <a href="{% url 'recipes:recipe_detail' pk=comment.recipe.pk %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
